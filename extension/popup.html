<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 정보 맑음? 선택 글 확인</title><style>body{box-sizing:border-box;width:360px;margin:0;padding:20px;background:#fffefb;color:#171a18;font:13px/1.7 Arial,'Malgun Gothic',sans-serif}h1{font-size:22px;line-height:1.4;letter-spacing:-1px}textarea{box-sizing:border-box;width:100%;height:200px;padding:12px;border:1px solid #bdc9b6;border-radius:3px;background:white;font:inherit;resize:vertical}button{width:100%;padding:12px;border:1px solid #171a18;border-radius:3px;color:white;background:#171a18;margin-top:10px;cursor:pointer;font:inherit;font-weight:bold}button.secondary{background:transparent;color:#266447;border-color:#8fa485}p{font-size:11px;color:#596653}#status{color:#7d4720}#count{text-align:right;margin-top:3px}label{font-weight:bold}</style></head><body><h1>선택한 글,<br>한 번 더 맑게.</h1><label for="preview">전달할 내용을 먼저 확인하세요</label><textarea id="preview" aria-describedby="privacy count"></textarea><p id="count"></p><p id="privacy">버튼을 눌렀을 때만 선택 글을 공개 분석 사이트로 전달합니다. 사이트에서 다시 분석 버튼을 눌러야 AI 요청이 전송됩니다. 개인정보·비공개 대화는 넣지 마세요.</p><button id="popup" type="button">작은 분석 창으로 열기</button><button id="open" type="button" class="secondary">전체 웹 화면으로 열기</button><p id="status" role="status" aria-live="polite"></p><script src="popup.js"></script></body></html>
